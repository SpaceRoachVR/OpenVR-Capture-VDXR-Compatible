name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build OBS plugin
        run: |
          cmake -B build/plugin -S plugins/win-openvr
          cmake --build build/plugin --config Release

      - name: Build OpenXR layer
        run: |
          cmake -B build/layers -S layers/openxr-vrcapture-layer
          cmake --build build/layers --config Release

      - name: Build and run tests
        run: |
          cmake -B build/tests -S tests
          cmake --build build/tests --config Release
          ctest --test-dir build/tests -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: vr-capture-${{ github.sha }}
          path: |
            build/plugin/Release/win-openvr.dll
            plugins/win-openvr/data
            build/layers/Release/openxr-vrcapture-layer.dll
            build/layers/Release/openxr-vrcapture-layer.json
            scripts/*.ps1
